<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheduled Meetings — Sharon Stories</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">

  <header class="site-header">
    <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu">
      <span></span><span></span>
    </button>
    <a href="index.html" class="brand">Sharon Stories</a>
    <nav class="site-menu" id="site-menu" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="events.html" aria-current="page">Events</a>
    </nav>
  </header>

  <section class="list-hero">
    <img src="images/background-books.webp" class="list-hero__bg" alt="">
    <h1>Scheduled<br>meetings</h1>
  </section>

  <section class="events-list" id="events-list">
    <!-- filled in by script below -->
  </section>

  <footer class="site-footer">Sharon Stories · a small book club</footer>

</div>

<script src="events-data.js"></script>
<script>
  const container = document.getElementById('events-list');
  const sorted = [...EVENTS].sort((a, b) => new Date(a.date) - new Date(b.date));

  if (sorted.length === 0) {
    container.innerHTML = '<p class="empty-state">No meetings scheduled yet — check back soon.</p>';
  } else {
    sorted.forEach(ev => {
      const card = document.createElement('a');
      card.className = 'event-card';
      card.href = 'event.html?id=' + encodeURIComponent(ev.id);

      const coverHtml = ev.coverImage
        ? `<img class="event-card__cover" src="${ev.coverImage}" alt="${ev.bookTitle} cover">`
        : `<div class="event-card__cover event-card__cover--placeholder">${ev.bookTitle || 'No book set yet'}</div>`;

      card.innerHTML = `
        ${coverHtml}
        <div class="event-card__body">
          <p class="event-card__title">${ev.title}</p>
          <p class="event-card__date">${ev.dateDisplay}</p>
          <span class="event-card__cta">View Event →</span>
        </div>
      `;
      container.appendChild(card);
    });
  }
</script>

<script src="menu.js"></script>
</body>
</html>
